app = 'creative-studio-iradukunda'
primary_region = 'ams'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[mounts]]
  source = 'messages_data'
  destination = '/app/server/data'

[vm]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
